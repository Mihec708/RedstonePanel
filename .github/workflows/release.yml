name: Release
on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        - name: Windows
          os: windows-latest
          args: 'nsis,msi'
        - name: Ubuntu
          os: ubuntu-22.04
          args: 'appimage,deb'
        - name: macOS
          os: macos-latest
          args: 'dmg'
    runs-on: ${{ matrix.os }}
    env:
      NODE_VERSION: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install npm dependencies
        run: npm install
      - name: Generate app icons
        run: python3 scripts/make_icons.py
      - name: Probe
        run: echo "full pipeline probe OK — ${{ matrix.name }} (${{ matrix.args }})"
