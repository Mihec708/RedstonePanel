name: Release
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        - name: Ubuntu
          os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe
        run: echo "ubuntu-latest matrix probe OK — ${{ runner.os }} ${{ runner.arch }}"
