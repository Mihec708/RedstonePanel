name: Release
on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        - name: Windows
          os: windows-latest
        - name: Ubuntu
          os: ubuntu-22.04
        - name: macOS
          os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe
        run: echo "matrix probe OK — ${{ matrix.name }}"
