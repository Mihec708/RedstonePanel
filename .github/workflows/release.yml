name: Release
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe
        run: echo "windows job OK"
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe
        run: echo "ubuntu job OK"
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe
        run: echo "macos job OK"
