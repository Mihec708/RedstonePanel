name: Release

# Trigger rules:
#   - tag push (v*)        -> real GitHub Release with that tag
#   - PR update / manual   -> 'preview' pre-release with test builds (visible on the Releases page)
#
# Only actions/checkout (a first-party GitHub action) is used; everything else
# is plain shell + curl/python, because this account has blocked some
# third-party actions.
#
# Publishing: each platform job calls scripts/publish_release.py, which creates
# the release (or fetches it if a sibling job got there first) and uploads that
# platform's artifacts. Safe to run in parallel across the three jobs.
#
# Diagnostics: the publish phase emits check-run annotations (always readable,
# no write permission needed) plus a paste.rs URL and, best-effort, an issue.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write
  metadata: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      issues: write
      metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        shell: bash
        run: npm install

      - name: Preflight
        shell: bash
        run: |
          {
            node --version || echo "node: FAILED"
            npm --version || echo "npm: FAILED"
            npx tauri --version || echo "npx tauri: FAILED"
            cargo --version || echo "cargo: FAILED"
            rustc --version || echo "rustc: FAILED"
            npm ls @tauri-apps/cli --depth=0 || echo "npm ls @tauri-apps/cli: FAILED"
          } > preflight.log 2>&1
          cat preflight.log

      - name: Generate app icons
        shell: bash
        run: python scripts/make_icons.py

      - name: Frontend build (isolated)
        shell: bash
        run: |
          if npm run build > frontend.log 2>&1; then
            echo "FRONTEND OK"
            tail -n 5 frontend.log
          else
            echo "FRONTEND FAILED"
            tail -n 60 frontend.log
            python scripts/post_ci_log.py windows
            exit 1
          fi

      - name: Build Windows installers
        shell: bash
        run: |
          if npx tauri build --bundles nsis,msi > build.log 2>&1; then
            echo "BUILD OK"
            tail -n 20 build.log
          else
            echo "===== build.log (tail) ====="
            tail -c 15000 build.log
            echo "===== preflight.log ====="
            cat preflight.log
            python scripts/post_ci_log.py windows
            exit 1
          fi

      - name: Publish marker
        shell: bash
        run: echo "::notice title=RedstonePanel-marker::windows reached publish phase bash=$BASH_VERSION"

      - name: Publish release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "::notice title=RedstonePanel-publish::windows step started bash=$BASH_VERSION"
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            echo "::notice title=RedstonePanel-publish::windows token re-injected from secrets context len=${#GITHUB_TOKEN}"
          fi
          PYTHON=python
          if [ ! -f scripts/publish_release.py ]; then
            echo "::error title=RedstonePanel-publish-diag::windows scripts/publish_release.py MISSING; pwd=$(pwd)"
            exit 2
          fi
          TOKEN_STATE=missing
          [ -n "$GITHUB_TOKEN" ] && TOKEN_STATE=set
          REPO=${GITHUB_REPOSITORY:-MISSING}
          echo "::notice title=RedstonePanel-publish::windows pre-check python=$(command -v $PYTHON || echo NOTFOUND) token=$TOKEN_STATE repo=$REPO"
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; PRE=""; else TAG="preview"; PRE="--prerelease"; fi
          echo "Publishing release tag: $TAG"
          $PYTHON scripts/publish_release.py --tag "$TAG" $PRE --bundle-dir src-tauri/target/release/bundle --ext .exe --ext .msi > publish_diag.txt 2>&1
          RC=$?
          echo "::notice title=RedstonePanel-publish::windows publish script finished RC=$RC"
          if [ $RC -ne 0 ]; then
            {
              echo "PUBLISH FAILED RC=$RC"
              echo "token: $([ -n "$GITHUB_TOKEN" ] && echo set || echo MISSING) repo=${GITHUB_REPOSITORY:-MISSING}"
              echo "python: $(command -v $PYTHON || echo MISSING) $($PYTHON --version 2>&1)"
              echo "scripts dir: $(ls -la scripts 2>&1 | tr '\n' ' ')"
              echo "--- publish output ---"
              cat publish_diag.txt
            } >> publish_diag.txt 2>&1
            PASTE_URL=$(curl -s -m 30 -X POST --data-binary @publish_diag.txt https://paste.rs/ 2>/dev/null || echo "paste-unavailable")
            echo "PASTE_URL=$PASTE_URL" >> publish_diag.txt
            $PYTHON scripts/post_diag.py publish publish_diag.txt 2>&1 | tee -a publish_diag.txt
            echo "::error title=RedstonePanel-publish-diag::windows RC=$RC PASTE=$PASTE_URL first=$(grep -m1 -E 'FATAL|HTTP [45][0-9][0-9]' publish_diag.txt)"
            cat publish_diag.txt
            exit $RC
          fi
          cat publish_diag.txt

  build-ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      issues: write
      metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Preflight
        run: |
          {
            node --version || echo "node: FAILED"
            npm --version || echo "npm: FAILED"
            npx tauri --version || echo "npx tauri: FAILED"
            cargo --version || echo "cargo: FAILED"
            rustc --version || echo "rustc: FAILED"
            npm ls @tauri-apps/cli --depth=0 || echo "npm ls @tauri-apps/cli: FAILED"
            pkg-config --modversion webkit2gtk-4.1 || echo "webkit2gtk-4.1: FAILED"
          } > preflight.log 2>&1
          cat preflight.log

      - name: Generate app icons
        run: python3 scripts/make_icons.py

      - name: Frontend build (isolated)
        run: |
          if npm run build > frontend.log 2>&1; then
            echo "FRONTEND OK"
            tail -n 5 frontend.log
          else
            echo "FRONTEND FAILED"
            tail -n 60 frontend.log
            python3 scripts/post_ci_log.py ubuntu
            exit 1
          fi

      - name: Build Ubuntu packages
        run: |
          if npx tauri build --bundles appimage,deb > build.log 2>&1; then
            echo "BUILD OK"
            tail -n 20 build.log
          else
            echo "===== build.log (tail) ====="
            tail -c 15000 build.log
            echo "===== preflight.log ====="
            cat preflight.log
            python3 scripts/post_ci_log.py ubuntu
            exit 1
          fi

      - name: Publish marker
        run: echo "::notice title=RedstonePanel-marker::ubuntu reached publish phase bash=$BASH_VERSION"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "::notice title=RedstonePanel-publish::ubuntu step started bash=$BASH_VERSION"
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            echo "::notice title=RedstonePanel-publish::ubuntu token re-injected from secrets context len=${#GITHUB_TOKEN}"
          fi
          PYTHON=python3
          if [ ! -f scripts/publish_release.py ]; then
            echo "::error title=RedstonePanel-publish-diag::ubuntu scripts/publish_release.py MISSING; pwd=$(pwd)"
            exit 2
          fi
          TOKEN_STATE=missing
          [ -n "$GITHUB_TOKEN" ] && TOKEN_STATE=set
          REPO=${GITHUB_REPOSITORY:-MISSING}
          echo "::notice title=RedstonePanel-publish::ubuntu pre-check python=$(command -v $PYTHON || echo NOTFOUND) token=$TOKEN_STATE repo=$REPO"
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; PRE=""; else TAG="preview"; PRE="--prerelease"; fi
          echo "Publishing release tag: $TAG"
          $PYTHON scripts/publish_release.py --tag "$TAG" $PRE --bundle-dir src-tauri/target/release/bundle --ext .AppImage --ext .deb > publish_diag.txt 2>&1
          RC=$?
          echo "::notice title=RedstonePanel-publish::ubuntu publish script finished RC=$RC"
          if [ $RC -ne 0 ]; then
            {
              echo "PUBLISH FAILED RC=$RC"
              echo "token: $([ -n "$GITHUB_TOKEN" ] && echo set || echo MISSING) repo=${GITHUB_REPOSITORY:-MISSING}"
              echo "python: $(command -v $PYTHON || echo MISSING) $($PYTHON --version 2>&1)"
              echo "scripts dir: $(ls -la scripts 2>&1 | tr '\n' ' ')"
              echo "--- publish output ---"
              cat publish_diag.txt
            } >> publish_diag.txt 2>&1
            PASTE_URL=$(curl -s -m 30 -X POST --data-binary @publish_diag.txt https://paste.rs/ 2>/dev/null || echo "paste-unavailable")
            echo "PASTE_URL=$PASTE_URL" >> publish_diag.txt
            $PYTHON scripts/post_diag.py publish publish_diag.txt 2>&1 | tee -a publish_diag.txt
            echo "::error title=RedstonePanel-publish-diag::ubuntu RC=$RC PASTE=$PASTE_URL first=$(grep -m1 -E 'FATAL|HTTP [45][0-9][0-9]' publish_diag.txt)"
            cat publish_diag.txt
            exit $RC
          fi
          cat publish_diag.txt

  build-macos:
    runs-on: macos-latest
    permissions:
