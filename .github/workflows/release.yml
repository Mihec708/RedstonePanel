name: Release

# Trigger rules:
#   - tag push (v*)        -> real GitHub Release with that tag
#   - PR update / manual   -> 'preview' pre-release with test builds (visible on the Releases page)
#
# Only actions/checkout (a first-party GitHub action) is used; everything else
# is plain shell + curl/python, because this account has blocked some
# third-party actions.
#
# Publishing: each platform job calls scripts/publish_release.py, which creates
# the release (or fetches it if a sibling job got there first) and uploads that
# platform's artifacts. Safe to run in parallel across the three jobs.
#
# Diagnostics: if a build step fails, the logs (preflight + frontend + build)
# are posted to an issue "CI build log (<platform>)" and printed in the job.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        shell: bash
        run: npm install

      - name: Preflight
        shell: bash
        run: |
          {
            node --version || echo "node: FAILED"
            npm --version || echo "npm: FAILED"
            npx tauri --version || echo "npx tauri: FAILED"
            cargo --version || echo "cargo: FAILED"
            rustc --version || echo "rustc: FAILED"
            npm ls @tauri-apps/cli --depth=0 || echo "npm ls @tauri-apps/cli: FAILED"
          } > preflight.log 2>&1
          cat preflight.log

      - name: Generate app icons
        shell: bash
        run: python scripts/make_icons.py

      - name: Frontend build (isolated)
        shell: bash
        run: |
          if npm run build > frontend.log 2>&1; then
            echo "FRONTEND OK"
            tail -n 5 frontend.log
          else
            echo "FRONTEND FAILED"
            tail -n 60 frontend.log
            python scripts/post_ci_log.py windows
            exit 1
          fi

      - name: Build Windows installers
        shell: bash
        run: |
          if npx tauri build --bundles nsis,msi > build.log 2>&1; then
            echo "BUILD OK"
            tail -n 20 build.log
          else
            echo "===== build.log (tail) ====="
            tail -c 15000 build.log
            echo "===== preflight.log ====="
            cat preflight.log
            python scripts/post_ci_log.py windows
            exit 1
          fi

      - name: Publish release
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; PRE=""; else TAG="preview"; PRE="--prerelease"; fi
          echo "Publishing release tag: $TAG"
          python scripts/publish_release.py --tag "$TAG" $PRE \
            --bundle-dir src-tauri/target/release/bundle \
            --ext .exe --ext .msi

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Preflight
        run: |
          {
            node --version || echo "node: FAILED"
            npm --version || echo "npm: FAILED"
            npx tauri --version || echo "npx tauri: FAILED"
            cargo --version || echo "cargo: FAILED"
            rustc --version || echo "rustc: FAILED"
            npm ls @tauri-apps/cli --depth=0 || echo "npm ls @tauri-apps/cli: FAILED"
            pkg-config --modversion webkit2gtk-4.1 || echo "webkit2gtk-4.1: FAILED"
          } > preflight.log 2>&1
          cat preflight.log

      - name: Generate app icons
        run: python3 scripts/make_icons.py

      - name: Frontend build (isolated)
        run: |
          if npm run build > frontend.log 2>&1; then
            echo "FRONTEND OK"
            tail -n 5 frontend.log
          else
            echo "FRONTEND FAILED"
            tail -n 60 frontend.log
            python3 scripts/post_ci_log.py ubuntu
            exit 1
          fi

      - name: Build Ubuntu packages
        run: |
          if npx tauri build --bundles appimage,deb > build.log 2>&1; then
            echo "BUILD OK"
            tail -n 20 build.log
          else
            echo "===== build.log (tail) ====="
            tail -c 15000 build.log
            echo "===== preflight.log ====="
            cat preflight.log
            python3 scripts/post_ci_log.py ubuntu
            exit 1
          fi

      - name: Publish release
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; PRE=""; else TAG="preview"; PRE="--prerelease"; fi
          echo "Publishing release tag: $TAG"
          python3 scripts/publish_release.py --tag "$TAG" $PRE \
            --bundle-dir src-tauri/target/release/bundle \
            --ext .AppImage --ext .deb

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm install

      - name: Preflight
        run: |
          {
            node --version || echo "node: FAILED"
            npm --version || echo "npm: FAILED"
            npx tauri --version || echo "npx tauri: FAILED"
            cargo --version || echo "cargo: FAILED"
            rustc --version || echo "rustc: FAILED"
            npm ls @tauri-apps/cli --depth=0 || echo "npm ls @tauri-apps/cli: FAILED"
          } > preflight.log 2>&1
          cat preflight.log

      - name: Generate app icons
        run: python3 scripts/make_icons.py

      - name: Frontend build (isolated)
        run: |
          if npm run build > frontend.log 2>&1; then
            echo "FRONTEND OK"
            tail -n 5 frontend.log
          else
            echo "FRONTEND FAILED"
            tail -n 60 frontend.log
            python3 scripts/post_ci_log.py macos
            exit 1
          fi

      - name: Build macOS DMG
        run: |
          if npx tauri build --bundles dmg > build.log 2>&1; then
            echo "BUILD OK"
            tail -n 20 build.log
          else
            echo "===== build.log (tail) ====="
            tail -c 15000 build.log
            echo "===== preflight.log ====="
            cat preflight.log
            python3 scripts/post_ci_log.py macos
            exit 1
          fi

      - name: Publish release
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; PRE=""; else TAG="preview"; PRE="--prerelease"; fi
          echo "Publishing release tag: $TAG"
          python3 scripts/publish_release.py --tag "$TAG" $PRE \
            --bundle-dir src-tauri/target/release/bundle \
            --ext .dmg
