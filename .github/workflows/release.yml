name: Release

# Trigger rules:
#   - tag push (v*)        -> real GitHub Release with that tag
#   - PR update / manual   -> 'preview' pre-release with test builds (visible on the Releases page)
#
# Only actions/checkout (a first-party GitHub action) is used; everything else
# is plain shell + curl/python, because this account has blocked some
# third-party actions.
#
# Publishing: each platform job calls scripts/publish_release.py, which creates
# the release (or fetches it if a sibling job got there first) and uploads that
# platform's artifacts. Safe to run in parallel across the three jobs.
#
# Diagnostics (if the publish step fails), in order of preference:
#   1. check-run annotation (always visible, no write permission needed)
#   2. paste.rs public URL (no auth needed to read)
#   3. reusable issue "CI build log (publish)" (needs issues: write)
#   4. job console

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        shell: bash
        run: npm install

      - name: Preflight
        shell: bash
        run: |
          {
            node --version || echo "node: FAILED"
            npm --version || echo "npm: FAILED"
            npx tauri --version || echo "npx tauri: FAILED"
            cargo --version || echo "cargo: FAILED"
            rustc --version || echo "rustc: FAILED"
            npm ls @tauri-apps/cli --depth=0 || echo "npm ls @tauri-apps/cli: FAILED"
          } > preflight.log 2>&1
          cat preflight.log

      - name: Generate app icons
        shell: bash
        run: python scripts/make_icons.py

      - name: Frontend build (isolated)
        shell: bash
        run: |
          if npm run build > frontend.log 2>&1; then
            echo "FRONTEND OK"
            tail -n 5 frontend.log
          else
            echo "FRONTEND FAILED"
            tail -n 60 frontend.log
            python scripts/post_ci_log.py windows
            exit 1
          fi

      - name: Build Windows installers
        shell: bash
        run: |
          if npx tauri build --bundles nsis,msi > build.log 2>&1; then
            echo "BUILD OK"
            tail -n 20 build.log
          else
            echo "===== build.log (tail) ====="
            tail -c 15000 build.log
            echo "===== preflight.log ====="
            cat preflight.log
            python scripts/post_ci_log.py windows
            exit 1
          fi

      - name: Publish release
        shell: bash
        run: |
          PYTHON=python
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; PRE=""; else TAG="preview"; PRE="--prerelease"; fi
          echo "Publishing release tag: $TAG (event: ${{ github.event_name }}, ref: ${{ github.ref }})"
          $PYTHON scripts/publish_release.py --tag "$TAG" $PRE \
            --bundle-dir src-tauri/target/release/bundle \
            --ext .exe --ext .msi > publish_diag.txt 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            {
              echo
              echo "===== PUBLISH FAILED (exit $RC) - diagnostics ====="
              echo "event: ${{ github.event_name }} | ref: ${{ github.ref }} | ref_name: ${{ github.ref_name }}"
              echo "GITHUB_TOKEN: $([ -n "$GITHUB_TOKEN" ] && echo "set (len ${#GITHUB_TOKEN})" || echo NOT SET)"
              echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-NOT SET}"
              echo "GITHUB_API_URL: ${GITHUB_API_URL:-unset}"
              echo "cwd: $(pwd)"
              echo "scripts dir:"; ls -la scripts 2>&1
              echo "python: $($PYTHON --version 2>&1) at $(command -v $PYTHON 2>&1 || echo NOT FOUND)"
              echo "===== token self-test ====="
              $PYTHON scripts/token_selftest.py 2>&1
              echo "===== publish script output ====="
              cat publish_diag.txt
            } >> publish_diag.txt 2>&1
            PASTE_URL=$(curl -s -m 30 -X POST --data-binary @publish_diag.txt https://paste.rs/ 2>/dev/null || echo "paste-unavailable")
            echo "DIAGNOSTIC PASTE URL: $PASTE_URL" >> publish_diag.txt
            $PYTHON scripts/post_diag.py publish publish_diag.txt || echo "WARNING: could not post diagnostics to issue"
            FIRST_FAIL=$(grep -m1 -E "FATAL|HTTP [45][0-9][0-9]" publish_diag.txt || echo "no FATAL/HTTP line found")
            echo "::error title=RedstonePanel-publish-diag::RC=$RC | PASTE_URL=$PASTE_URL | $FIRST_FAIL"
            echo "===== console copy of diagnostics ====="
            cat publish_diag.txt
            exit $RC
          fi
          cat publish_diag.txt

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Preflight
        run: |
          {
            node --version || echo "node: FAILED"
            npm --version || echo "npm: FAILED"
            npx tauri --version || echo "npx tauri: FAILED"
            cargo --version || echo "cargo: FAILED"
            rustc --version || echo "rustc: FAILED"
            npm ls @tauri-apps/cli --depth=0 || echo "npm ls @tauri-apps/cli: FAILED"
            pkg-config --modversion webkit2gtk-4.1 || echo "webkit2gtk-4.1: FAILED"
          } > preflight.log 2>&1
          cat preflight.log

      - name: Generate app icons
        run: python3 scripts/make_icons.py

      - name: Frontend build (isolated)
        run: |
          if npm run build > frontend.log 2>&1; then
            echo "FRONTEND OK"
            tail -n 5 frontend.log
          else
            echo "FRONTEND FAILED"
            tail -n 60 frontend.log
            python3 scripts/post_ci_log.py ubuntu
            exit 1
          fi

      - name: Build Ubuntu packages
        run: |
          if npx tauri build --bundles appimage,deb > build.log 2>&1; then
            echo "BUILD OK"
            tail -n 20 build.log
          else
            echo "===== build.log (tail) ====="
            tail -c 15000 build.log
            echo "===== preflight.log ====="
            cat preflight.log
            python3 scripts/post_ci_log.py ubuntu
            exit 1
          fi

      - name: Publish release
        run: |
          PYTHON=python3
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; PRE=""; else TAG="preview"; PRE="--prerelease"; fi
          echo "Publishing release tag: $TAG (event: ${{ github.event_name }}, ref: ${{ github.ref }})"
          $PYTHON scripts/publish_release.py --tag "$TAG" $PRE \
            --bundle-dir src-tauri/target/release/bundle \
            --ext .AppImage --ext .deb > publish_diag.txt 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            {
              echo
              echo "===== PUBLISH FAILED (exit $RC) - diagnostics ====="
              echo "event: ${{ github.event_name }} | ref: ${{ github.ref }} | ref_name: ${{ github.ref_name }}"
              echo "GITHUB_TOKEN: $([ -n "$GITHUB_TOKEN" ] && echo "set (len ${#GITHUB_TOKEN})" || echo NOT SET)"
              echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-NOT SET}"
              echo "GITHUB_API_URL: ${GITHUB_API_URL:-unset}"
              echo "cwd: $(pwd)"
              echo "scripts dir:"; ls -la scripts 2>&1
              echo "python: $($PYTHON --version 2>&1) at $(command -v $PYTHON 2>&1 || echo NOT FOUND)"
              echo "===== token self-test ====="
              $PYTHON scripts/token_selftest.py 2>&1
              echo "===== publish script output ====="
              cat publish_diag.txt
            } >> publish_diag.txt 2>&1
            PASTE_URL=$(curl -s -m 30 -X POST --data-binary @publish_diag.txt https://paste.rs/ 2>/dev/null || echo "paste-unavailable")
            echo "DIAGNOSTIC PASTE URL: $PASTE_URL" >> publish_diag.txt
            $PYTHON scripts/post_diag.py publish publish_diag.txt || echo "WARNING: could not post diagnostics to issue"
            FIRST_FAIL=$(grep -m1 -E "FATAL|HTTP [45][0-9][0-9]" publish_diag.txt || echo "no FATAL/HTTP line found")
            echo "::error title=RedstonePanel-publish-diag::RC=$RC | PASTE_URL=$PASTE_URL | $FIRST_FAIL"
            echo "===== console copy of diagnostics ====="
            cat publish_diag.txt
            exit $RC
          fi
          cat publish_diag.txt

  build-macos:
    runs-on: macos-latest
    steps:
