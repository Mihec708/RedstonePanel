name: Release
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        - name: Ubuntu
          os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Say hello
        run: echo "matrix probe OK on ${{ runner.os }} / ${{ matrix.name }}"
