name: Release
# Diagnostic round: ubuntu-only, no third-party actions, self-reporting via PR comments.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: diag-apt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.number }}" ]; then
            curl -s -o /dev/null -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"body":"[diag] apt dependencies OK"}' "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments"
          fi

      - name: Check preinstalled toolchain
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          python3 --version
      - name: diag-toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.number }}" ]; then
            curl -s -o /dev/null -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"body":"[diag] preinstalled toolchain OK (rustc/cargo/node/npm/python3)"}' "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments"
          fi

      - name: Install npm dependencies
        run: npm install
      - name: diag-npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.number }}" ]; then
            curl -s -o /dev/null -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"body":"[diag] npm install OK"}' "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments"
          fi

      - name: Generate app icons
        run: python3 scripts/make_icons.py
      - name: diag-icons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.number }}" ]; then
            curl -s -o /dev/null -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"body":"[diag] icons generated OK"}' "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments"
          fi

      - name: Build frontend
        run: npm run build
      - name: diag-frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.number }}" ]; then
            curl -s -o /dev/null -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"body":"[diag] frontend build OK"}' "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments"
          fi

      - name: Show artifacts
        run: |
          ls -la src-tauri/icons
          ls -la dist
